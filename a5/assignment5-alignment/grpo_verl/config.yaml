# Edit this file directly, then launch with:
#   python3 train.py
# Useful checks:
#   python3 train.py --dry-run
#   python3 train.py --print-config
# Fixed in train.py:
#   train data: data/train.parquet
#   validation data: data/validation.parquet

run:
  experiment: grpo_verl
  run_name: null
  wandb_project: cs336-assignment5-grpo-verl
  logger:
    - console
  seed: 42
  num_train_samples: null
  num_eval_examples: null
  eval_every: 20
  log_val_generations: 0
  nnodes: 1
  n_gpus_per_node: 1
  balance_batch: false

grpo:
  # Keep handwritten GRPO semantics here:
  # rollout_batch_size and train_batch_size count sampled completions, not prompts.
  reward_style: r1_zero
  loss_type: reinforce_with_baseline
  n_grpo_steps: 200
  learning_rate: 3.0e-5
  advantage_eps: 1.0e-6
  rollout_batch_size: 128
  train_batch_size: 128
  gradient_accumulation_steps: 32
  group_size: 4
  epochs_per_rollout_batch: 1
  cliprange: 0.2
  use_std_normalization: true
  use_kl_loss: false
  fast_reward: true

generation:
  max_prompt_length: 512
  max_response_length: 384
  temperature: 1.0
  top_k: -1
  top_p: 1.0
  do_sample: true
  gpu_memory_utilization: 0.5

verl:
  model_path: /data/a5-alignment/models/Qwen2.5-Math-1.5B
  hybrid_engine: true
  rollout_name: vllm
  actor_strategy: fsdp
  trust_remote_code: true
  enable_gradient_checkpointing: true
  use_remove_padding: true
  use_torch_compile: false
  actor_loss_agg_mode: seq-mean-token-mean
  actor_entropy_coeff: 0.0
  tensor_model_parallel_size: 1
  max_num_batched_tokens: 4096
  max_num_seqs: 128
  ignore_eos: false
  reward_num_workers: 1
  save_freq: -1
  critic_warmup: 0
  val_before_train: false
  resume_mode: disable
  dataloader_num_workers: 1

  # Advanced escape hatch: any raw VERL key can be overridden here.
  # Example:
  # overrides:
  #   actor_rollout_ref.rollout.max_num_seqs: 64
  overrides: {}
